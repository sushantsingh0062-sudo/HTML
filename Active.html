<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: lightgray;
            border: none;
            cursor: pointer;
        }
        button:hover{
            background-color: blue;
            color: white;
        }
        button:active{
            background-color: red;
        }
        
    </style>
</head>
<body>
    <h2> button hover</h2>
    <button> Click Me  </button>

</body>
</html>
