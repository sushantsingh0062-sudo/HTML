<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        li:nth-child(odd){
            color: red;

        }
        li:nth-child(even){
            color: blue;
            

        }
        li:nth-child(4){
            color:black
        }

    </style>

</head>
<body>
    <li>apple</li>
    <li>orange</li>
    <li>pineapple</li>
    <li>moasambi</li>
    <li>kela</li>
    
</body>
</html>
