<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <h1>Registration Form</h1>
    <style>
        
    </style>
    <style>
        input[type="password"]{
            border: 2px solid red;
        }
        body{
            text-align: center;
        }
        input[type="submit"]{
            color: antiquewhite;
            background-color: blue;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>
<body style="margin: 10px; padding: 10px;">
    <div class="form-container">
        <form>
            <label for="name">Full Name</label>
            <input type="text" id="name" required placeholder="Enter your name" style="border: 2px solid red;">
            <br>
            <br>
            <label for="email">Email</label>
            <input type="email" id="email" required placeholder="Enter your Email" style="border: 2px solid red;">
            <br>
            <br>
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter password" style="border: 2px solid red;">
            <br>
            <br>
            <label for="gender">Gender</label>
            <select id="gender" required style="border: 2px solid red;">
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
            <br>
            <br>
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Enter Mobile Number">
            <br>
            <br>
            <input type="submit" value="Register">
        </form>
    </div>
</body>
</html>
