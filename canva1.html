<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello Future 🚀</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Resize canvas
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// Floating text
let textY;
let direction = 1;

// ✨ Particles
const particles = Array.from({ length: 50 }, () => ({
  x: Math.random() * window.innerWidth,
  y: Math.random() * window.innerHeight,
  r: Math.random() * 2 + 1,
  speed: Math.random() * 0.5 + 0.2
}));

const fireworks = [];

// 🎨 Background (NEW COLORS)
function drawBackground() {
  const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
  gradient.addColorStop(0, "#0f2027");
  gradient.addColorStop(0.5, "#203a43");
  gradient.addColorStop(1, "#2c5364");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// 🌟 Particles
function drawParticles() {
  particles.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(200,230,255,0.4)";
    ctx.fill();

    p.y -= p.speed;
    if (p.y < 0) p.y = canvas.height;
  });
}

// 🎆 Fireworks (NEW COLORS)
function createFirecracker() {
  const x = Math.random() * canvas.width;
  const y = Math.random() * canvas.height * 0.5 + 60;

  const colors = ["#ff006e", "#fb5607", "#ffbe0b", "#8338ec", "#3a86ff"];

  for (let i = 0; i < 45; i++) {
    fireworks.push({
      x,
      y,
      angle: Math.random() * Math.PI * 2,
      speed: Math.random() * 3 + 1,
      radius: Math.random() * 2 + 1,
      life: 100,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function drawFirecrackers() {
  for (let i = fireworks.length - 1; i >= 0; i--) {
    const f = fireworks[i];

    f.x += Math.cos(f.angle) * f.speed;
    f.y += Math.sin(f.angle) * f.speed;
    f.life--;

    ctx.beginPath();
    ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
    ctx.fillStyle = f.color;
    ctx.globalAlpha = f.life / 100;
    ctx.fill();

    if (f.life <= 0) fireworks.splice(i, 1);
  }
  ctx.globalAlpha = 1;
}

// 🖋 Text (NEW TEXT)
function drawText() {
  if (!textY) textY = canvas.height / 2;

  ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0,255,200,0.8)";
  ctx.shadowBlur = 25;

  ctx.font = "700 52px 'Playfair Display'";
  ctx.fillStyle = "#00f5d4";
  ctx.fillText("Hello Future 🚀", canvas.width / 2, textY);

  ctx.shadowBlur = 0;
  ctx.font = "400 22px 'Poppins'";
  ctx.fillStyle = "#caf0f8";
  ctx.fillText(
    "Dream Big • Work Hard • Stay Consistent",
    canvas.width / 2,
    textY + 55
  );
}

// 🎬 Animation Loop
function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawBackground();
  drawParticles();
  drawFirecrackers();
  drawText();

  if (Math.random() < 0.045) createFirecracker();

  textY += 0.3 * direction;
  if (textY > canvas.height / 2 + 12 || textY < canvas.height / 2 - 18) {
    direction *= -1;
  }

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
